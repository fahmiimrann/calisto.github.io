            await onUpdateRecord({ ...editingRecord, ...details }, verifiedPassword);
            setEditingRecord(null);
            setVerifiedPassword('');
            showToast && showToast('Patient record updated.');
        } catch (err) {
            showToast && showToast(err.message || 'Could not update record.');

    return (

                        <input value={search} onChange={e => { setSearch(e.target.value); setPage(1); }} placeholder="Search name, ID, disease..." className="pl-11 pr-4 py-3 bg-white/80 border border-slate-100 rounded-xl text-sm w-72 focus:outline-none focus:ring-2 focus:ring-blue-100" />
                    </div>
                    <select value={filter} onChange={e => { setFilter(e.target.value); setPage(1); }} className="px-4 py-3 bg-white/80 border border-slate-100 rounded-xl text-sm">
                        {diseases.map(item => <option key={item}>{item}</option>)}
                    </select>
                    <select value={sort} onChange={e => setSort(e.target.value)} className="px-4 py-3 bg-white/80 border border-slate-100 rounded-xl text-sm">
                        <option value="date">Sort by Date</option>
                        <option value="name">Sort by Name</option>
                        <option value="severity">Sort by Severity</option>
                    </select>
                </div>
            </div>
            <div className="calisto-card rounded-3xl overflow-hidden">
                <table className="w-full text-left">
                    <thead className="bg-white/70 text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em] border-b border-slate-100">

                            <th className="px-8 py-5">Record ID</th>
                            <th className="px-8 py-5">Date</th>
                            <th className="px-8 py-5">AI Result</th>
                            <th className="px-8 py-5 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                        {shown.map(record => (
                            <tr key={record.id} className="hover:bg-white/60 transition-colors">
                                <td className="px-8 py-6">
                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center font-bold text-slate-500">{record.patient.charAt(0)}</div>
                                        <div>
                                            <p className="font-bold">{record.patient}</p>
                                            <p className="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Age: {record.age}</p>
                                        </div>
                                    </div>
                                </td>
                                <td className="px-8 py-6 text-slate-500 font-mono text-sm">{record.id}</td>
                                <td className="px-8 py-6 text-slate-500 text-sm">{record.date}</td>
                                <td className="px-8 py-6"><StatusPill result={record.result} /></td>
                                <td className="px-8 py-6 text-right">
                                    <div className="inline-flex items-center gap-2">
                                        <button onClick={() => onRecordClick(record)} title="View report" className="px-3 py-2 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 text-xs font-bold">
                                            <i className="fa-solid fa-eye"></i>
                                        </button>
                                        <button onClick={() => setPendingAction({ type: 'edit', record })} title="Edit record (password required)" className="px-3 py-2 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-600 text-xs font-bold">

                                        <button onClick={() => setPendingAction({ type: 'delete', record })} title="Delete record (password required)" className="px-3 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold">

                    <button disabled={page >= totalPages} onClick={() => setPage(page + 1)} className="px-3 py-2 bg-white/80 border border-slate-100 rounded-lg disabled:opacity-40">Next</button>

                description={pendingAction

                    : ''}
                onVerify={onVerifyPassword}

                onCancel={() => setPendingAction(null)}

            />

            <PatientDetailsForm
                open={!!editingRecord}

}
// Analytics — derives every metric from the live records array so the
// Insights page is always in lock-step with the Overview / Dashboard.
// All numeric work uses the helpers at the top of this file
// (caseDistribution, dailyVolume, weeklyVolume, ageGroupPeak,
// criticalCount, reviewedPerDay).
function Analytics({ records = [], showToast }) {
    const [range, setRange] = useState('7d');
    const [customStart, setCustomStart] = useState('');
    const [customEnd, setCustomEnd] = useState('');
    const isCustomSelected = range === 'custom';
    const isCustom = isCustomSelected && customStart && customEnd && customStart <= customEnd;
    const days = range === '30d' ? 30
        : isCustom ? (Math.floor((new Date(customEnd) - new Date(customStart)) / 86400000) + 1)
        : 7;

    const recentRecords = useMemo(() => (
        isCustomSelected ? (isCustom ? recordsBetween(records, customStart, customEnd) : [])
                         : getRecentRecords(records, days)
    ), [records, days, isCustomSelected, isCustom, customStart, customEnd]);
    const distribution  = useMemo(() => caseDistribution(recentRecords),     [recentRecords]);
    const trendBars     = useMemo(() => (
        isCustom ? rangeVolume(recentRecords, customStart, customEnd).series
        : days <= 14 ? dailyVolume(recentRecords, days) : weeklyVolume(recentRecords, 4)
    ), [recentRecords, days, isCustom, customStart, customEnd]);
    const ageStats      = useMemo(() => ageGroupPeak(recentRecords),         [recentRecords]);
    const reviewed      = useMemo(() => (
        isCustom ? rangeVolume(recentRecords, customStart, customEnd)
                 : reviewedPerDay(recentRecords, days)
    ), [recentRecords, days, isCustom, customStart, customEnd]);
    // Gender distribution is sourced from the FULL Patient Registry, not
    // the active time-window. Demographics are a property of the patient
    // base, not the recent screening volume — limiting the donut to the
    // last 7/30 days hid every patient screened earlier and produced a
    // distorted "X PATIENTS" count that disagreed with the actual
    // registry. genderDistribution() deduplicates by `${name}|${age}` so
    // the donut now reports unique patients across the whole registry.
    const genderStats   = useMemo(() => genderDistribution(records),         [records]);

    // Colour order must match caseDistribution(): Normal, DR, Glaucoma, AMD.
    const caseColors  = ['#10b981','#ef4444','#8b5cf6','#f59e0b'];
    const trendColors = DAILY_BAR_COLORS;

    const maxTrend    = Math.max(1, ...trendBars.map(b => b.count));
    const maxReviewed = Math.max(1, ...reviewed.series.map(s => s.count));
    const todayKey    = todayYMD();

    return (
        <div className="animate-in fade-in slide-in-from-bottom-4 duration-700">
            <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-5 mb-8">
                <div>
                    <h1 className="text-3xl font-bold tracking-tight">Analytics Dashboard</h1>
                    <p className="text-slate-500 mt-1">
                        {isCustomSelected
                            ? (isCustom
                                ? `Computed from ${recentRecords.length} record${recentRecords.length === 1 ? '' : 's'} between ${customStart} and ${customEnd}.`
                                : 'Pick a start and end date to see analytics for that period.')
                            : `Computed from ${recentRecords.length} record${recentRecords.length === 1 ? '' : 's'} in the last ${days} days.`}
                    </p>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                    {['7d','30d','custom'].map(item => (
                        <button key={item} onClick={() => { setRange(item); showToast && showToast(`Analytics range: ${item === '7d' ? 'last 7 days' : item === '30d' ? 'last 30 days' : 'custom'}`); }} className={`px-4 py-2 rounded-full text-xs font-bold uppercase border ${range === item ? 'premium-gradient text-white border-slate-800' : 'bg-white/80 text-slate-500 border-slate-100'}`}>
                            {item === '7d' ? 'Last 7 days' : item === '30d' ? 'Last 30 days' : 'Custom'}
                        </button>
                    ))}
                    {isCustomSelected && (
                        <div className="flex items-center gap-2 ml-1 bg-white/80 border border-slate-100 rounded-2xl px-3 py-1.5">
                            <i className="fa-solid fa-calendar-days text-slate-400 text-xs"></i>
                            <input type="date" value={customStart} max={customEnd || undefined} onChange={e => setCustomStart(e.target.value)} className="bg-transparent text-xs font-semibold text-slate-600 focus:outline-none" />
                            <span className="text-slate-400 text-xs font-bold">to</span>
                            <input type="date" value={customEnd} min={customStart || undefined} onChange={e => setCustomEnd(e.target.value)} className="bg-transparent text-xs font-semibold text-slate-600 focus:outline-none" />
                        </div>
                    )}
                </div>
            </div>
            <div className="grid grid-cols-1 xl:grid-cols-3 gap-8">
                <div className="calisto-card rounded-3xl p-8">
                    <h3 className="font-bold text-sm uppercase tracking-widest text-slate-400 mb-6">Case Distribution</h3>
                    <div className="space-y-4">
                        {distribution.map((item, i) => {
                            const color = caseColors[i % caseColors.length];
                            return (
                                <div key={item.label}>
                                    <div className="flex justify-between text-xs font-bold text-slate-500 mb-1.5">
                                        <span className="flex items-center gap-2">
                                            <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: color }}></span>
                                            {item.label}
                                        </span>
                                        <span>{item.pct}% <span className="text-slate-400 font-normal">({item.count})</span></span>
                                    </div>
                                    <div className="h-2 bg-slate-100 rounded-full overflow-hidden">
                                        <div className="h-full rounded-full transition-all duration-500" style={{ width: `${item.pct}%`, backgroundColor: color }}></div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
                <div className="xl:col-span-2 calisto-card rounded-3xl p-8">
                    <h3 className="font-bold text-sm uppercase tracking-widest text-slate-400 mb-6">AI Efficiency Metrics</h3>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <MetricCard label="Sensitivity" value="96.2%" />
                        <MetricCard label="Specificity" value="94.8%" />
                        <MetricCard label="Precision" value="92.1%" />
                        <MetricCard label="Avg Latency" value="1.2s" />
                    </div>
                    <div className="h-56 flex items-end gap-3">
                        {trendBars.map((bar, i) => {
                            const color = trendColors[i % trendColors.length];
                            const heightPct = Math.max(8, Math.round((bar.count / maxTrend) * 100));
                            return (
                                <div key={`${bar.label}-${i}`} className="flex-1 flex flex-col items-center gap-3">
                                    <div className="w-full bg-slate-100 rounded-t-xl relative overflow-hidden" style={{ height: '180px' }}>
                                        <span className="absolute -top-6 left-1/2 -translate-x-1/2 text-[10px] font-bold text-slate-500">{bar.count}</span>
                                        <div
                                            className="absolute bottom-0 w-full rounded-t-xl shadow-lg opacity-90 hover:opacity-100"
                                            style={{ height: `${heightPct}%`, backgroundColor: color, transition: 'height 0.6s cubic-bezier(.65,-0.03,.51,1.09)' }}
                                        ></div>
                                    </div>
                                    <span className="text-[10px] font-bold text-slate-400 uppercase">{bar.label}</span>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8">
                <div className="calisto-card rounded-2xl p-6">
                    <GenderDistributionPie stats={genderStats} />
                </div>
                <div className="calisto-card rounded-2xl p-6">
                    <MetricCard label="Age Group Peak" value={ageStats.peak.count > 0 ? `${ageStats.peak.label} (${ageStats.peak.count})` : 'No data'} />
                    <div className="mt-3 space-y-1.5">
                        {ageStats.bins.map(b => {
                            const widthPct = ageStats.peak.count > 0 ? Math.round((b.count / ageStats.peak.count) * 100) : 0;
                            const isPeak = b.label === ageStats.peak.label && b.count > 0;
                            return (
                                <div key={b.label} className="flex items-center gap-2 text-[11px] text-slate-500">
                                    <span className={`w-10 font-mono ${isPeak ? 'font-bold text-slate-700' : ''}`}>{b.label}</span>
                                    <div className="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                        <div className={`h-full ${isPeak ? 'bg-emerald-500' : 'bg-slate-400'}`} style={{ width: `${widthPct}%`, transition: 'width 0.4s ease-out' }}></div>
                                    </div>
                                    <span className="w-6 text-right tabular-nums">{b.count}</span>
                                </div>
                            );
                        })}
                    </div>
                </div>
                <div className="calisto-card rounded-2xl p-6">
                    <MetricCard label="Reviewed Today" value={`${reviewed.todayCount} ${reviewed.todayCount === 1 ? 'case' : 'cases'}`} />
                    <div className="mt-3 space-y-1.5">
                        {reviewed.series.slice(-7).map(s => {
                            const isToday = s.key === todayKey;
                            const widthPct = Math.round((s.count / maxReviewed) * 100);
                            return (
                                <div key={s.key} className="flex items-center gap-2 text-[11px] text-slate-500">
                                    <span className={`w-10 font-mono ${isToday ? 'font-bold text-slate-700' : ''}`}>{s.label}</span>
                                    <div className="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                        <div className={`h-full ${isToday ? 'bg-emerald-500' : 'bg-slate-400'}`} style={{ width: `${widthPct}%`, transition: 'width 0.4s ease-out' }}></div>
                                    </div>
                                    <span className="w-6 text-right tabular-nums">{s.count}</span>
                                </div>
                            );
                        })}
                    </div>
                    <p className="text-[11px] text-slate-400 mt-3">
                        Avg {reviewed.avg.toFixed(1)} / day over the last {days} days.
                    </p>
                </div>
            </div>
        </div>
    );
}

                                        showToast && showToast('New password must be at least 4 characters.');
                                        return;
                                    }
                                    try {
                                        await onChangePassword(current, next);
                                        form.reset();
                                        showToast && showToast('Password changed.');
                                    } catch (err) {
                                        showToast && showToast(err.message || 'Could not change password.');
                                    }
                                }}
                            >

                                <input

                            </div>
                        </div>

                {tab === 'system' && (
                    <div className="space-y-7">
                        <h2 className="text-2xl font-bold">AI Core Configuration</h2>
                        <div className="p-6 bg-slate-50 rounded-3xl border border-slate-100 space-y-5">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">

function SettingSelect({ label, options, defaultValue, onChange }) {
    const [value, setValue] = useState(defaultValue ?? options?.[0]?.value);
    function handleChange(e) {
        const next = e.target.value;
        setValue(next);
        const picked = options.find(opt => opt.value === next);
        onChange && onChange(picked?.label || next);
    }
    return (
        <div>
            <label className="text-[10px] uppercase tracking-widest text-slate-400 font-bold">{label}</label>
            <div className="relative mt-2">
                <select
                    value={value}
                    onChange={handleChange}
                    className="w-full appearance-none px-4 py-3 pr-10 bg-slate-50 border border-slate-100 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-200 cursor-pointer"
                >
                    {options.map(opt => (
                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                    ))}
                </select>
                <i className="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
            </div>
        </div>
    );
}

function SettingToggle({ label, active = false, onClick }) {
    const [localActive, setLocalActive] = useState(active);
    const current = onClick ? active : localActive;
    function toggle() {
        if (onClick) onClick();
        else setLocalActive(v => !v);
    }
    return (
        <button type="button" onClick={toggle} className="w-full flex items-center justify-between p-5 bg-slate-50 rounded-2xl border border-slate-100 text-left">
            <span className="text-sm font-medium text-slate-700">{label}</span>
            <span className={`w-11 h-6 rounded-full relative transition ${current ? 'bg-slate-900' : 'bg-slate-300'}`}>
                <span className={`absolute top-1 w-4 h-4 bg-white rounded-full transition ${current ? 'right-1' : 'left-1'}`}></span>
            </span>
        </button>
    );
}

// Settings → Device Link. Fundus cameras are registered explicitly here and
// persisted in localStorage; the Diagnostics "Connect Local Camera" picker
// reads the same list. When nothing is connected the panel shows a clear
// empty state instead of inventing hardware.
function DeviceLinkPanel({ showToast }) {
    const [cameras, setCameras] = useState(() => getFundusCameras());
    const [adding, setAdding] = useState(false);
    const [editingId, setEditingId] = useState(null);
    const [model, setModel] = useState('');
    const [connection, setConnection] = useState('USB 3.0');

    function persist(list) {
        setCameras(list);
        setFundusCameras(list);
    }
    function resetForm() {
        setAdding(false);
        setEditingId(null);
        setModel('');
        setConnection('USB 3.0');
    }
    function saveCamera() {
        const name = model.trim();
        if (!name) { showToast && showToast('Enter a camera model.'); return; }
        if (editingId) {
            persist(cameras.map(c => c.id === editingId ? { ...c, model: name, connection } : c));
            showToast && showToast(`${name} saved.`);
        } else {
            const cam = { id: `cam-${Date.now()}`, model: name, connection, connectedAt: new Date().toISOString() };
            persist([...cameras, cam]);
            showToast && showToast(`${name} saved.`);
        }
        resetForm();
    }
    function editCamera(cam) {
        setEditingId(cam.id);
        setModel(cam.model);
        setConnection(cam.connection || 'USB 3.0');
        setAdding(true);
    }
    function deleteCamera(id) {
        const cam = cameras.find(c => c.id === id);
        persist(cameras.filter(c => c.id !== id));
        if (editingId === id) resetForm();
        showToast && showToast(`${cam ? cam.model : 'Device'} deleted.`);
    }

    return (
        <div className="space-y-7">
            <div className="flex items-center justify-between gap-3 flex-wrap">
                <h2 className="text-2xl font-bold">Connected Hardware</h2>
                {!adding && (
                    <button onClick={() => setAdding(true)} className="px-4 py-2 premium-gradient text-white rounded-xl text-sm font-bold">
                        <i className="fa-solid fa-plus mr-2"></i>Connect fundus camera
                    </button>
                )}
            </div>

            {adding && (
                <div className="p-6 bg-slate-50 rounded-3xl border border-slate-100 space-y-4">
                    <p className="font-bold">{editingId ? 'Edit fundus camera' : 'Connect a fundus camera'}</p>
                    <div className="grid sm:grid-cols-2 gap-3">
                        <div>
                            <label className="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Camera model</label>
                            <input type="text" value={model} onChange={e=>setModel(e.target.value)} placeholder="Type your fundus camera model" autoComplete="off" className="w-full mt-2 px-4 py-3 bg-white border border-slate-100 rounded-2xl text-sm" />
                        </div>
                        <div>
                            <label className="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Connection</label>
                            <select value={connection} onChange={e=>setConnection(e.target.value)} className="w-full mt-2 px-4 py-3 bg-white border border-slate-100 rounded-2xl text-sm">
                                {['USB 3.0','USB 2.0','USB-C','Ethernet (LAN)','Wi-Fi'].map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                        </div>
                    </div>
                    <div className="flex gap-3">
                        <button onClick={saveCamera} className="px-5 py-2.5 bg-emerald-600 text-white rounded-xl text-sm font-bold"><i className="fa-solid fa-floppy-disk mr-2"></i>Save device</button>
                        <button onClick={resetForm} className="px-5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-500">Cancel</button>
                    </div>
                </div>
            )}

            {cameras.length === 0 && !adding && (
                <div className="p-10 bg-slate-50 rounded-3xl border border-dashed border-slate-200 text-center">
                    <div className="w-14 h-14 mx-auto bg-white rounded-2xl flex items-center justify-center text-slate-300 text-xl mb-4"><i className="fa-solid fa-camera-retro"></i></div>
                    <p className="font-bold text-slate-600">No fundus camera connected</p>
                    <p className="text-sm text-slate-500 mt-1">Connect a fundus camera to capture images directly in Diagnostics.</p>
                </div>
            )}

            {cameras.map(cam => (
                <div key={cam.id} className="p-6 bg-slate-50 rounded-3xl border border-slate-100 flex items-center justify-between">
                    <div className="flex items-center gap-4">
                        <div className="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600"><i className="fa-solid fa-camera-retro"></i></div>
                        <div><p className="font-bold">{cam.model}</p><p className="text-xs text-emerald-600 font-bold uppercase tracking-widest">Active connection · {cam.connection}</p></div>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={() => editCamera(cam)} className="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-600"><i className="fa-solid fa-pen mr-2"></i>Edit</button>
                        <button onClick={() => deleteCamera(cam.id)} className="px-4 py-2 bg-white border border-rose-200 rounded-xl text-xs font-bold text-rose-600"><i className="fa-solid fa-trash mr-2"></i>Delete</button>
                    </div>
                </div>
            ))}

            <SettingToggle label="Auto-detect optic disc focus" active />
            <SettingToggle label="Adaptive brightness correction" active />
            <SettingToggle label="Export as DICOM by default" />
        </div>
    );
}
// Reusable password verification modal — used before edit/delete in Patient Registry.
// Pass `onVerify(password)` for backend verification (async, throws on failure)
// or `expectedPassword` for client-side comparison only.
function PasswordPrompt({ open, title, description, expectedPassword, onVerify, onCancel, onConfirm, confirmLabel = 'Confirm' }) {
    const [pw, setPw] = useState('');
    const [err, setErr] = useState('');
    const [show, setShow] = useState(false);
    const [busy, setBusy] = useState(false);

    useEffect(() => {
        if (!open) {
            setPw('');
            setErr('');
            setShow(false);
            setBusy(false);
        }
    }, [open]);

    if (!open) return null;

    async function submit(e) {
        e.preventDefault();
        if (!pw) {
            setErr('Please enter your password to continue.');
            return;
        }
        if (expectedPassword && pw !== expectedPassword) {
            setErr('Incorrect password. Please try again.');
            return;
        }
        if (onVerify) {
            try {
                setBusy(true);
                await onVerify(pw);
            } catch (verifyErr) {
                setErr(verifyErr.message || 'Verification failed.');
                setBusy(false);
                return;
            }
            setBusy(false);
        }
        onConfirm(pw);
    }

    return (
        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in" onMouseDown={onCancel}>
            <form onMouseDown={e => e.stopPropagation()} onSubmit={submit} autoComplete="off" className="bg-white rounded-3xl w-full max-w-md shadow-2xl p-7 space-y-5">
                <div className="flex items-start gap-4">
                    <div className="w-11 h-11 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center">
                        <i className="fa-solid fa-shield-halved"></i>
                    </div>
                    <div className="flex-1">
                        <h3 className="text-lg font-bold text-[#1a1a1e]">{title || 'Verify Your Password'}</h3>
                        <p className="text-sm text-slate-500 mt-1">{description || 'For security, please re-enter your account password to continue.'}</p>
                    </div>
                </div>
                <div className="relative">
                    <input
                        type={show ? 'text' : 'password'}
                        value={pw}
                        onChange={e => { setPw(e.target.value); setErr(''); }}
                        placeholder="Account password"
                        autoFocus
                        autoComplete="current-password"
                        className="w-full px-4 py-3 pr-12 bg-slate-50 border border-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100"
                    />
                    <button
                        type="button"
                        onClick={() => setShow(s => !s)}
                        className="absolute right-3 top-1/2 -translate-y-1/2 h-8 w-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-100"
                        aria-label={show ? 'Hide password' : 'Show password'}
                    >
                        <i className={`fa-solid ${show ? 'fa-eye-slash' : 'fa-eye'} text-sm`}></i>
                    </button>
                </div>
                {err && <p className="text-xs text-rose-500 -mt-2">{err}</p>}
                <div className="flex justify-end gap-3 pt-1">
                    <button type="button" onClick={onCancel} disabled={busy} className="px-5 py-2 bg-white border border-slate-200 rounded-xl text-sm font-bold disabled:opacity-60">Cancel</button>
                    <button type="submit" disabled={busy} className="px-5 py-2 premium-gradient text-white rounded-xl text-sm font-bold disabled:opacity-60">
                        {busy ? 'Verifying...' : confirmLabel}
                    </button>
                </div>
            </form>
        </div>
    );
}

// Patient details form shown after a fundus image is captured/uploaded (before
// scanning) or when editing an existing record. In create mode the Record ID is
// auto-generated by the server based on the AI diagnosis, so we surface that
// here as a read-only informational row.
function PatientDetailsForm({ open, mode = 'create', initial, recordIdHint, onCancel, onSubmit }) {
    const [form, setForm] = useState({
        patient: '',
        nric: '',
        age: '',
        gender: 'Female',
        doctor: ''
    });

    useEffect(() => {
        if (!open) return;
        setForm({
            patient: initial?.patient || '',
            nric: initial?.nric || '',
            age: initial?.age != null ? String(initial.age) : '',
            gender: initial?.gender || 'Female',
            doctor: initial?.doctor || ''
        });
    }, [open, initial]);

    if (!open) return null;

    function update(field, value) {
        setForm(f => ({ ...f, [field]: value }));
    }

    function submit(e) {
        e.preventDefault();
        if (!form.patient.trim() || !form.age) return;
        onSubmit({
            patient: form.patient.trim(),
            nric: form.nric.trim(),
            age: Number(form.age),
            gender: form.gender,
            doctor: form.doctor.trim() || 'Unassigned'
        });
    }

    const heading = mode === 'edit' ? 'Edit Patient Record' : 'Patient Details';
    const description = mode === 'edit'
        ? 'Update the patient information for this record.'
        : 'Enter the patient information before running the AI scan. The Record ID will be auto-generated based on the AI diagnosis.';

    // What to show for the Record ID display row. In edit mode (or once the
    // record is saved) we show the actual ID; otherwise we show a placeholder
    // explaining the OCU-H/AMD/DR/G naming scheme.
    const recordIdDisplay = recordIdHint
        ? recordIdHint
        : 'Auto-generated after AI diagnosis';

    return (
        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in" onMouseDown={onCancel}>
            <form onMouseDown={e => e.stopPropagation()} onSubmit={submit} autoComplete="off" className="bg-white rounded-3xl w-full max-w-lg shadow-2xl p-8 space-y-5">
                <div className="flex items-start justify-between gap-4">
                    <div>
                        <p className="text-[10px] uppercase tracking-[0.24em] text-slate-400 font-bold">{mode === 'edit' ? 'Edit Record' : 'New Diagnostic Record'}</p>
                        <h3 className="text-xl font-bold text-[#1a1a1e] mt-1">{heading}</h3>
                        <p className="text-sm text-slate-500 mt-1">{description}</p>
                    </div>
                    <button type="button" onClick={onCancel} className="text-slate-400 hover:text-slate-700 p-1" aria-label="Close">
                        <i className="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="sm:col-span-2">
                        <label className="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Patient Full Name</label>
                        <input
                            type="text"
                            required
                            value={form.patient}
                            onChange={e => update('patient', e.target.value)}
                            className="w-full mt-2 px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl text-sm"
                            autoComplete="off"
                        />
                    </div>
                    <div className="sm:col-span-2">
                        <label className="text-[10px] uppercase tracking-widest text-slate-400 font-bold">NRIC / Passport No.</label>
                        <input
                            type="text"
                            value={form.nric}
                            onChange={e => update('nric', e.target.value)}
                            placeholder="e.g. 900101-14-5678"
                            className="w-full mt-2 px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl text-sm"
                            autoComplete="off"
                        />
                    </div>
                    <div>
                        <label className="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Age</label>
                        <input
                            type="number"
                            min="0"
                            max="130"
                            required
                            value={form.age}
                            onChange={e => update('age', e.target.value)}
                            className="w-full mt-2 px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl text-sm"
                            autoComplete="off"
                        />
                    </div>
                    <div>
                        <label className="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Gender</label>
                        <select
                            value={form.gender}
                            onChange={e => update('gender', e.target.value)}
                            className="w-full mt-2 px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl text-sm"
                        >
                            <option>Female</option>
                            <option>Male</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div className="sm:col-span-2">
                        <label className="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Attending Clinician</label>
                        <input
                            type="text"
                            value={form.doctor}
                            onChange={e => update('doctor', e.target.value)}
                            placeholder="e.g. Dr. Julian Voss"
                            className="w-full mt-2 px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl text-sm"
                            autoComplete="off"
                        />
                    </div>
                    <div className="sm:col-span-2">
                        <label className="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Record ID</label>
                        <div className="w-full mt-2 px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl text-sm flex items-center justify-between gap-3">
                            <span className={`font-mono ${recordIdHint ? 'text-[#1a1a1e]' : 'text-slate-400 italic'}`}>{recordIdDisplay}</span>
                            <span className="text-[10px] uppercase tracking-widest text-slate-400 font-bold whitespace-nowrap">
                                <i className="fa-solid fa-wand-magic-sparkles mr-1"></i> Auto
                            </span>
                        </div>
                        {!recordIdHint && (
                            <p className="text-[11px] text-slate-400 mt-2 leading-relaxed">
                                Healthy <span className="font-mono">OCU-H#####</span> &middot; AMD <span className="font-mono">OCU-AMD#####</span> &middot; DR <span className="font-mono">OCU-DR#####</span> &middot; Glaucoma <span className="font-mono">OCU-G#####</span>
                            </p>
                        )}
                    </div>
                </div>
                <div className="flex justify-end gap-3 pt-1">
                    <button type="button" onClick={onCancel} className="px-5 py-2 bg-white border border-slate-200 rounded-xl text-sm font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2 premium-gradient text-white rounded-xl text-sm font-bold">
                        {mode === 'edit' ? 'Save Changes' : 'Add to Patient Registry'}
                    </button>
                </div>
            </form>
        </div>
    );
}

// Modal for editing the logged-in user's account information.
function AccountEditModal({ open, user, onCancel, onSubmit, showToast }) {
    const [form, setForm] = useState({ name: '', username: '', email: '', avatar: '' });
    const avatarRef = useRef();

    useEffect(() => {
        if (!open) return;
        setForm({
            name: user?.name || '',
            username: user?.username || '',
            email: user?.email || `${user?.username || 'user'}@calisto.com`,
            avatar: user?.avatar || ''
        });
    }, [open, user]);

    if (!open) return null;

    function update(field, value) {
        setForm(prev => ({ ...prev, [field]: value }));
    }

    function handleAvatarFile(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
            showToast && showToast('Avatar must be JPG or PNG under 2 MB.');
            e.target.value = '';
            return;
        }
        const reader = new FileReader();
        reader.onload = evt => update('avatar', evt.target.result);
        reader.readAsDataURL(file);
        e.target.value = '';
    }

    function submit(e) {
        e.preventDefault();
        if (!form.name.trim()) {
            showToast && showToast('Display name cannot be empty.');
            return;
        }
        if (!form.username.trim()) {
            showToast && showToast('Username cannot be empty.');
            return;
        }
        onSubmit({
            name: form.name.trim(),
            username: form.username.trim(),
            email: form.email.trim(),
            avatar: form.avatar
        });
    }

    return (
        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in" onMouseDown={onCancel}>

                    <button type="button" onClick={onCancel} className="text-slate-400 hover:text-slate-700 p-1" aria-label="Close">
                        <i className="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <div className="flex items-center gap-5 p-5 bg-slate-50 rounded-3xl border border-slate-100">
                    <div className="w-20 h-20 rounded-2xl bg-white overflow-hidden flex items-center justify-center border border-slate-100">
                        {form.avatar ? (
                            <img src={form.avatar} className="w-full h-full object-cover" alt="Avatar" />

                            <span className="text-2xl font-bold text-slate-400">{(form.name || 'U').charAt(0).toUpperCase()}</span>

                    </div>
                    <div className="flex-1">
                        <input ref={avatarRef} type="file" accept="image/png,image/jpeg" className="hidden" onChange={handleAvatarFile} />
                        <div className="flex flex-wrap gap-2">
                            <button type="button" onClick={() => avatarRef.current?.click()} className="px-4 py-2 premium-gradient text-white rounded-xl text-xs font-bold">Update Avatar</button>
                            {form.avatar && (
                                <button type="button" onClick={() => update('avatar', '')} className="px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-xl text-xs font-bold">Remove</button>

                        <p className="text-[10px] text-slate-400 mt-2 font-bold uppercase tracking-widest">JPG or PNG - max 2MB</p>

    const [register, setRegister] = useState(false);
    const [form, setForm] = useState({ username: "", password: "", confirm: "", name: "", type: "" });
    const [error, setError] = useState("");
    const [loading, setLoading] = useState(false);
    const [showPassword, setShowPassword] = useState(false);

    function handleChange(e) {
        setForm(f => ({ ...f, [e.target.name]: e.target.value }));
    }

    async function handleSubmit(e) {
        e.preventDefault();
        setError("");
        try {
            setLoading(true);
            if (register) {
                if (!form.name.trim() || !form.username.trim() || !form.password.trim() || !form.confirm.trim() || !form.type.trim()) {
                    setError("Please fill in all fields.");
                    return;
                }
                if (form.password !== form.confirm) {
                    setError("Passwords don't match.");
                    return;
                }
                if (form.password.length < 4) {
                    setError("Password too short.");
                    return;
                }
                const data = await apiJson('/api/register', 'POST', {
                    name: form.name.trim(),
                    username: form.username.trim(),
                    password: form.password,
                    type: form.type.trim()
                });
                onAuth({ user: data.user, token: data.token, password: form.password });
            } else {
                const data = await apiJson('/api/login', 'POST', {
                    username: form.username,
                    password: form.password
                });
                onAuth({ user: data.user, token: data.token, password: form.password });

            setError(err.message || (register ? "Registration failed." : "Login failed."));

// --- Deterministic PRNG + feature generator (mirrors combined.py outputs) ---
function makeRng(seed) {
    let s = (seed | 0) || 1;
    return () => {
        s = (Math.imul(s, 1664525) + 1013904223) | 0;
        return (s >>> 0) / 4294967296;
    };
}
function hashRecordId(id) {
    let h = 2166136261 >>> 0;
    const str = String(id || '');
    for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return h >>> 0;
}
function generateFeatures(record) {
    const rng = makeRng(hashRecordId(record.id));
    const j = (lo, hi) => lo + (hi - lo) * rng();
    const cond = (record.result || '').toLowerCase();

    // Healthy baseline (typical clinical fundus statistics)
    const f = {
        GLCM_Contrast:        j(28, 42),
        GLCM_Correlation:     j(0.93, 0.97),
        GLCM_Energy:          j(0.13, 0.18),
        GLCM_Homogeneity:     j(0.50, 0.60),
        Intensity_Mean:       j(108, 128),
        Intensity_StdDev:     j(46, 58),
        Intensity_Skewness:   j(0.05, 0.45),
        Intensity_Kurtosis:   j(-1.10, -0.50),
        Intensity_Entropy:    j(7.15, 7.45),
        Intensity_Uniformity: j(0.0060, 0.0095),
        Intensity_DynRange:   j(244, 255),
        Vessel_GVD_pct:       j(10.4, 12.6),
        Vessel_MaxLVD:        j(0.28, 0.34),
        Vessel_Symmetry:      j(0.88, 0.97),
        ONH_DiscArea_px2:     j(6200, 7400),
        ONH_CupToDiscRatio:   j(0.22, 0.36),
    };

    if (cond.includes('early glaucoma')) {
        f.ONH_CupToDiscRatio = j(0.46, 0.58);
        f.ONH_DiscArea_px2   = j(7000, 7800);
        f.Vessel_GVD_pct     = j(9.6, 11.0);
        f.GLCM_Contrast      = j(36, 48);
    } else if (cond.includes('glaucoma')) {
        f.ONH_CupToDiscRatio = j(0.62, 0.78);
        f.ONH_DiscArea_px2   = j(7400, 8400);
        f.Vessel_GVD_pct     = j(8.8, 10.2);
        f.GLCM_Contrast      = j(38, 52);
        f.Intensity_StdDev   = j(50, 60);
    } else if (cond.includes('diabetic') || cond.includes('retinopathy')) {
        f.GLCM_Contrast      = j(58, 84);
        f.GLCM_Correlation   = j(0.86, 0.91);
        f.GLCM_Energy        = j(0.09, 0.13);
        f.GLCM_Homogeneity   = j(0.42, 0.50);
        f.Intensity_StdDev   = j(60, 72);
        f.Intensity_Skewness = j(0.55, 1.10);
        f.Intensity_Kurtosis = j(-0.40, 0.80);
        f.Intensity_Entropy  = j(7.45, 7.75);
        f.Vessel_GVD_pct     = j(8.6, 10.4);
        f.Vessel_Symmetry    = j(0.62, 0.78);
        f.Vessel_MaxLVD      = j(0.34, 0.42);
    } else if (cond.includes('amd')) {
        f.GLCM_Energy          = j(0.06, 0.10);
        f.GLCM_Homogeneity     = j(0.40, 0.48);
        f.Intensity_Entropy    = j(7.55, 7.82);
        f.Intensity_Uniformity = j(0.0035, 0.0060);
        f.Intensity_Skewness   = j(-0.30, 0.20);
        f.Vessel_GVD_pct       = j(9.4, 11.2);
        f.Vessel_Symmetry      = j(0.74, 0.86);
    }

    f.Intensity_Variance   = f.Intensity_StdDev * f.Intensity_StdDev;
    f.Intensity_LogKurt    = Math.log(1e-5 + Math.abs(f.Intensity_Kurtosis));
    f.Intensity_Smoothness = 1 - 1 / (1 + f.Intensity_Variance);
    return f;
}

function buildInterpretation(record, f) {
    const cond = (record.result || '').toLowerCase();
    const validation = cond.includes('healthy') ? 'Optional' : 'Recommended';
    const risk = cond.includes('healthy') ? 'Low'
               : cond.includes('early')   ? 'Moderate'
               : cond.includes('amd')     ? 'Moderate'
               : 'High';
    let summary, findings = [];

    if (cond.includes('healthy')) {
        summary = "Fundus pattern is within baseline range. Optic nerve head morphology, vessel architecture and intensity statistics are consistent with a healthy retina.";
        findings = [
            `Cup-to-disc ratio of ${f.ONH_CupToDiscRatio.toFixed(2)} is within normal range (<0.40).`,
            `Vessel symmetry index of ${f.Vessel_Symmetry.toFixed(2)} indicates balanced retinal vascular distribution.`,
            `GLCM contrast of ${f.GLCM_Contrast.toFixed(1)} reflects typical texture heterogeneity.`,
            `Routine annual screening recommended.`,
        ];
    } else if (cond.includes('early glaucoma')) {
        summary = "Borderline cup-to-disc ratio with mild morphological changes detected. Early glaucoma indicators are present and warrant ophthalmologist review.";
        findings = [
            `Cup-to-disc ratio of ${f.ONH_CupToDiscRatio.toFixed(2)} is in the borderline range (0.45 - 0.60).`,
            `Disc area of ${f.ONH_DiscArea_px2.toFixed(0)} px² is mildly enlarged.`,
            `Vessel architecture and intensity profile appear largely preserved.`,
            `Follow-up imaging in 3 - 6 months recommended for trend monitoring.`,
        ];
    } else if (cond.includes('glaucoma')) {
        summary = "Enlarged cup-to-disc ratio and ONH morphology suggest glaucomatous optic neuropathy. Confirm with visual field testing and OCT.";
        findings = [
            `Cup-to-disc ratio of ${f.ONH_CupToDiscRatio.toFixed(2)} exceeds the 0.60 glaucoma threshold.`,
            `Disc area of ${f.ONH_DiscArea_px2.toFixed(0)} px² reflects an enlarged optic nerve head.`,
            `Peripapillary vessel density of ${f.Vessel_GVD_pct.toFixed(2)}% indicates vascular attenuation.`,
            `Urgent ophthalmologist referral recommended.`,
        ];
    } else if (cond.includes('diabetic') || cond.includes('retinopathy')) {
        summary = "Texture and intensity statistics indicate microaneurysms and intraretinal hemorrhages consistent with diabetic retinopathy. Specialist evaluation required.";
        findings = [
            `Elevated GLCM contrast of ${f.GLCM_Contrast.toFixed(1)} suggests focal lesions disrupting retinal texture.`,
            `Vessel symmetry of ${f.Vessel_Symmetry.toFixed(2)} reflects vascular asymmetry common in DR.`,
            `Skewness of ${f.Intensity_Skewness.toFixed(2)} indicates intensity shift typical of hemorrhagic foci.`,
            `Reduced GVD of ${f.Vessel_GVD_pct.toFixed(2)}% suggests vascular drop-out.`,
            `Recommend HbA1c review and laser/anti-VEGF consultation.`,
        ];
    } else if (cond.includes('amd')) {
        summary = "Sub-foveal drusen and intensity uniformity changes are consistent with age-related macular degeneration.";
        findings = [
            `Reduced GLCM energy of ${f.GLCM_Energy.toFixed(3)} indicates increased textural variance from drusen deposits.`,
            `Elevated intensity entropy of ${f.Intensity_Entropy.toFixed(2)} suggests heterogeneous macular reflectance.`,
            `Vessel symmetry of ${f.Vessel_Symmetry.toFixed(2)} remains within tolerance.`,
            `Recommend macular OCT and AREDS supplementation review.`,
        ];
    } else {
        summary = "Diagnostic findings outside the standard categories. Manual review by an ophthalmologist is recommended.";
        findings = [
            `Reported confidence: ${record.confidence}.`,
            `Severity classification: ${record.severity}.`,
        ];
    }

    // Referral guidance: what happens next, where to go, and who to see.
    let referral;
    if (cond.includes('healthy')) {
        referral = {
            to: 'Optometrist',
            where: 'community / hospital eye clinic',
            next: 'No urgent referral required — continue routine annual fundus screening.',
            urgency: 'Routine'
        };
    } else if (cond.includes('early glaucoma')) {
        referral = {
            to: 'Ophthalmologist (Glaucoma clinic)',
            where: 'ophthalmology outpatient / glaucoma clinic',
            next: 'Refer for optic-nerve OCT and visual field testing to confirm; review in 3 - 6 months.',
            urgency: 'Soon · 3 - 6 months'
        };
    } else if (cond.includes('glaucoma')) {
        referral = {
            to: 'Ophthalmologist (Glaucoma specialist)',
            where: 'ophthalmology / glaucoma clinic',
            next: 'Urgent referral for IOP assessment, visual field testing and OCT to confirm glaucoma.',
            urgency: 'Urgent · 1 - 2 weeks'
        };
    } else if (cond.includes('diabetic') || cond.includes('retinopathy')) {
        referral = {
            to: 'Ophthalmologist (Medical Retina)',
            where: 'retina / vitreoretinal clinic',
            next: "Refer for a dilated retinal exam, with possible laser / anti-VEGF; coordinate HbA1c and diabetic review with the patient's physician.",
            urgency: 'Urgent · 1 - 2 weeks'
        };
    } else if (cond.includes('amd')) {
        referral = {
            to: 'Ophthalmologist (Medical Retina)',
            where: 'retina / macula clinic',
            next: 'Refer for macular OCT; advise AREDS2 supplementation review and Amsler-grid self-monitoring.',
            urgency: 'Soon · within weeks'
        };
    } else {
        referral = {
            to: 'Ophthalmologist',
            where: 'ophthalmology outpatient clinic',
            next: 'Refer for manual review and confirmatory testing.',
            urgency: 'Recommended'
        };
    }

    return { summary, findings, validation, risk, referral };
}

// --- Stylized fundus SVG matching combined.py 2x2 plot grid ---
function vesselPath(rng, ox, oy) {
    const angle = rng() * Math.PI * 2;
    const len = 30 + rng() * 28;
    const ex = ox + Math.cos(angle) * len;
    const ey = oy + Math.sin(angle) * len;
    const mx = (ox + ex) / 2 + (rng() - 0.5) * 22;
    const my = (oy + ey) / 2 + (rng() - 0.5) * 22;
    const m2x = (mx + ex) / 2 + (rng() - 0.5) * 14;
    const m2y = (my + ey) / 2 + (rng() - 0.5) * 14;
    return `M${ox},${oy} Q${mx},${my} ${m2x},${m2y} T${ex},${ey}`;
}
function FundusSVG({ mode = 'original', cdr = 0.3, condition = '', seed = 1 }) {
    const cond = (condition || '').toLowerCase();
    const cupScale = Math.max(0.18, Math.min(0.94, cdr));
    // Disc and cup are CIRCLES (single radius) so the overlays stay
    // perfectly circular instead of stretching into ovals.
    const discR = 6.8;
    const cupR  = discR * cupScale;
    const ox = 65, oy = 50;
    const gradientId = `retina-${seed}-${mode}`;

    const vessels = useMemo(() => {
        const rng = makeRng((seed ^ 0xa5a5a5) >>> 0);
        return Array.from({ length: 9 }, () => ({
            d: vesselPath(rng, ox, oy),
            w: 0.55 + rng() * 0.7,
        }));
    }, [seed]);

    const lesionCount = cond.includes('diabetic') || cond.includes('retinopathy') ? 18
                      : cond.includes('amd') ? 9 : 0;
    const lesions = useMemo(() => {
        const rng = makeRng((seed ^ 0xdeadbe) >>> 0);
        return Array.from({ length: lesionCount }, () => ({
            cx: 22 + rng() * 56,
            cy: 22 + rng() * 56,
            r: 0.55 + rng() * 1.1,
        }));
    }, [seed, lesionCount]);

    if (mode === 'vessel') {
        return (
            <svg viewBox="0 0 100 100" className="w-full h-full">
                <rect width="100" height="100" fill="#000" />
                {vessels.map((v, i) => (
                    <path key={i} d={v.d} stroke="#fff" strokeWidth={v.w} fill="none" strokeLinecap="round" />

    }

    const claheClass = mode === 'clahe' ? 'grayscale contrast-150 brightness-90' : '';
    const lesionFill = cond.includes('amd') ? '#f5da7e' : '#4a0606';

    return (
        <svg viewBox="0 0 100 100" className={`w-full h-full ${claheClass}`}>
            <defs>
                <radialGradient id={gradientId} cx="55%" cy="50%" r="62%">

                    <stop offset="40%"  stopColor="#c8631c" />
                    <stop offset="80%"  stopColor="#5a2008" />
                    <stop offset="100%" stopColor="#1a0500" />

            <rect width="100" height="100" fill="#0a0500" />
            <circle cx="50" cy="50" r="48" fill={`url(#${gradientId})`} />
            {vessels.map((v, i) => (
                <path key={i} d={v.d} stroke="#7a1a0c" strokeWidth={v.w * 0.95} fill="none" strokeLinecap="round" opacity="0.92" />
            ))}
            <circle cx="40" cy="50" r="3.2" fill="#3d1206" opacity="0.55" />
            <circle cx={ox} cy={oy} r={discR} fill="#fde9b6" />
            <circle cx={ox} cy={oy} r={cupR}  fill="#fff8da" />
            {lesions.map((l, i) => (
                <circle key={i} cx={l.cx} cy={l.cy} r={l.r} fill={lesionFill} opacity="0.92" />
            ))}
            {mode === 'onh' && (
                <>
                    <circle cx={ox} cy={oy} r={discR} fill="none" stroke="#65d873" strokeWidth="0.8" />
                    <circle cx={ox} cy={oy} r={cupR}  fill="none" stroke="#ff5050" strokeWidth="0.65" />
                </>
            )}
        </svg>
    );

// Real-image counterparts of the four fundus panels in the report.
// When the patient record carries the original upload, we render it directly
// (with CSS filters approximating CLAHE / vessel / ONH outputs) so the report
// always reflects the same image the clinician uploaded in Diagnostics.
function FundusImagePanel({ mode, src, cdr = 0.3, features = null }) {
    if (mode === 'vessel') {
        // Preferred path: the MATLAB pipeline shipped back a base64 PNG of
        // the real vessel mask — render it directly so the panel matches
        // what MATLAB's bwmorph / top-hat pipeline produced. Fall back to
        // the CSS SVG filter on the raw image for legacy/demo records.
        // The MATLAB mask is already restricted to the retina ROI, so we
        // render it at full panel size to match the other three panels.
        const f = features || {};
        const rawMask = typeof f.Vessel_MaskPng === 'string' ? f.Vessel_MaskPng.trim() : '';
        const hasRealMask = rawMask.length > 256 && /^[A-Za-z0-9+/=\s]+$/.test(rawMask);
        if (hasRealMask) {
            return (
                <div className="w-full h-full relative bg-black">
                    <img
                        src={`data:image/png;base64,${rawMask}`}
                        alt="Vessel segmentation mask"
                        className="absolute inset-0 w-full h-full"
                        style={{ objectFit: 'fill', filter: 'brightness(1.2) contrast(1.15)' }}
                    />
                </div>
            );
        }
        return (
            <div className="w-full h-full relative bg-black">
                <img
                    src={src}
                    alt="Vessel segmentation overlay"
                    className="w-full h-full object-cover"
                    style={{ filter: 'url(#ocu-vessel-extract)' }}
                />
            </div>
        );
    }

    if (mode === 'clahe') {
        return (
            <img
                src={src}
                alt="CLAHE-enhanced fundus"
                className="w-full h-full object-cover"
                style={{ filter: 'grayscale(1) contrast(1.55) brightness(0.92)' }}
            />
        );
    }

    if (mode === 'onh') {
        // Prefer the real disc/cup geometry reported by the AI pipeline
        // (normalised to the 512x512 working frame). Newer extractor builds
        // emit ONH_DiscRadiusX_norm / ONH_DiscRadiusY_norm so the disc can
        // be drawn as an ellipse that follows the U-Net mask's true aspect
        // ratio; older records (with only ONH_DiscRadius_norm) still draw
        // a circle. Falls back to a centred pair of ellipses for legacy
        // records that pre-date the ONH features entirely.
        const f = features || {};
        const inUnit = v => Number.isFinite(v) && v >= 0 && v <= 1;
        const cupScale = Math.max(0.18, Math.min(0.94, cdr));
        const fallbackDiscR = 0.16;
        const dcx = inUnit(f.ONH_DiscCenterX_norm) ? f.ONH_DiscCenterX_norm : 0.5;
        const dcy = inUnit(f.ONH_DiscCenterY_norm) ? f.ONH_DiscCenterY_norm : 0.5;
        const dr  = inUnit(f.ONH_DiscRadius_norm)  ? f.ONH_DiscRadius_norm  : fallbackDiscR;
        const drx = inUnit(f.ONH_DiscRadiusX_norm) ? f.ONH_DiscRadiusX_norm : dr;
        const dry = inUnit(f.ONH_DiscRadiusY_norm) ? f.ONH_DiscRadiusY_norm : dr;
        const ccx = inUnit(f.ONH_CupCenterX_norm)  ? f.ONH_CupCenterX_norm  : dcx;
        const ccy = inUnit(f.ONH_CupCenterY_norm)  ? f.ONH_CupCenterY_norm  : dcy;
        const crx = inUnit(f.ONH_CupRadiusX_norm)  ? f.ONH_CupRadiusX_norm  : dr * cupScale;
        const cry = inUnit(f.ONH_CupRadiusY_norm)  ? f.ONH_CupRadiusY_norm  : dr * cupScale;
        // Floor the cup radii so they never collapse below a sliver of the
        // disc — this keeps the overlay readable even when the U-Net's cup
        // segmentation is tiny (e.g. on healthy fundi with shallow cups).
        const crxFinal = Math.max(crx, drx * 0.18);
        const cryFinal = Math.max(cry, dry * 0.18);
        return (
            <div className="relative w-full h-full">
                {/* object-fill matches the AI pipeline's resize(img,[512 512]),
                    so normalised disc/cup coordinates map 1:1 onto the displayed pixels. */}
                <img src={src} alt="ONH segmentation" className="absolute inset-0 w-full h-full" style={{ objectFit: 'fill' }} />
                <svg viewBox="0 0 1 1" preserveAspectRatio="none" className="absolute inset-0 w-full h-full pointer-events-none">
                    {/* Soft glow halo so the disc outline stays visible on bright fundi */}
                    <ellipse cx={dcx} cy={dcy} rx={drx} ry={dry} fill="none" stroke="rgba(101,216,115,0.35)" strokeWidth="4" vectorEffect="non-scaling-stroke" />
                    <ellipse cx={dcx} cy={dcy} rx={drx} ry={dry} fill="none" stroke="#65d873" strokeWidth="1.8" vectorEffect="non-scaling-stroke" />
                    <ellipse cx={ccx} cy={ccy} rx={crxFinal} ry={cryFinal} fill="none" stroke="rgba(255,80,80,0.35)" strokeWidth="3" vectorEffect="non-scaling-stroke" />
                    <ellipse cx={ccx} cy={ccy} rx={crxFinal} ry={cryFinal} fill="none" stroke="#ff5050" strokeWidth="1.4" vectorEffect="non-scaling-stroke" />
                </svg>
            </div>
        );
    }

    return <img src={src} alt="Resized fundus" className="w-full h-full object-cover" />;
}
function FeatureGroup({ title, rows, columns = 1 }) {
    const gridClass = columns === 2 ? 'grid grid-cols-1 sm:grid-cols-2 ocu-print-grid-2 gap-x-6 gap-y-2' : 'space-y-2';

}

function RecordModal({ record, onClose }) {
    if (!record) return null;
    const seed = useMemo(() => hashRecordId(record.id), [record.id]);
    // Prefer the features the AI model actually computed at screening time;
    // only fall back to the deterministic generator for legacy seed records
    // that were added before features were captured.
    const features = useMemo(() => {
        const baseline = generateFeatures(record);
        if (record.features && typeof record.features === 'object') {
            return { ...baseline, ...record.features };
        }
        return baseline;
    }, [record]);
    const interp = useMemo(() => buildInterpretation(record, features), [record, features]);

    useEffect(() => {
        const onEsc = e => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onEsc);
        return () => document.removeEventListener('keydown', onEsc);
    }, [onClose]);

    // Toggle the global `ocu-printing` class around window.print() so the
    // dedicated @media print rules can isolate the report from the rest of

    function handlePrintReport() {
        if (typeof window === 'undefined' || !window.print) return;
        document.body.classList.add('ocu-printing');
        const cleanup = () => {
            document.body.classList.remove('ocu-printing');
            window.removeEventListener('afterprint', cleanup);
        };
        window.addEventListener('afterprint', cleanup);
        // Fallback for browsers that don't fire afterprint reliably.
        setTimeout(() => document.body.classList.remove('ocu-printing'), 5000);
        try { window.print(); } catch (_) { cleanup(); }

    const isRemoteBackend = Boolean(API_BASE_URL) && API_BASE_URL.includes('onrender.com');

// Main Application
const App = () => {
    // bootState: 'loading' | 'auth' | 'app'. We hydrate from the backend (using
    // the persisted auth token) before rendering the main UI on every refresh.
    const [bootState, setBootState] = useState(() => getAuthToken() ? 'loading' : 'auth');
    const [bootMessage, setBootMessage] = useState('Restoring your session...');

    const [user, setUser] = useState(null);
    const [records, setRecords] = useState([]);
    const [view, setView] = useState('dashboard');
    const [notifications, setNotifications] = useState(MOCK_NOTIFICATIONS);
    const [lastScanResult, setLastScanResult] = useState(null);

    // Record panel modal
    const [modalRecord, setModalRecord] = useState(null);

    // Toast system
    const [ToastComponent, triggerToast] = useToast();

    // On mount, if we already have a saved token, hydrate the user and records.
    useEffect(() => {
        const token = getAuthToken();
        if (!token) return;
        let cancelled = false;
        (async () => {
            try {
                const me = await apiRequest('/api/users/me');
                if (cancelled) return;
                setUser(me.user);
                const rec = await apiRequest('/api/records');
                if (cancelled) return;
                setRecords(rec.records || []);
                setBootState('app');
            } catch (err) {
                if (cancelled) return;
                setAuthToken('');
                setBootState('auth');
            }
        })();
        return () => { cancelled = true; };
    }, []);

    async function loadRecords() {
        try {
            const rec = await apiRequest('/api/records');
            setRecords(rec.records || []);
        } catch (err) {
            triggerToast(err.message || 'Could not load records.');
        }
    }

    async function handleAuth({ user: authedUser, token }) {
        setAuthToken(token || '');
        setUser(authedUser);
        setBootMessage('Loading patient registry...');
        try {
            const rec = await apiRequest('/api/records');
            setRecords(rec.records || []);
        } catch (err) {
            triggerToast(err.message || 'Could not load records.');
        }
        setBootState('app');
        triggerToast('Welcome, ' + (authedUser?.name || authedUser?.username || 'user') + '!');
    }

    async function onLogout() {
        try {
            await apiRequest('/api/logout', { method: 'POST' });
        } catch (err) {
            // Silent — even if the server can't be reached we still clear locally.
        }
        setAuthToken('');
        setUser(null);
        setRecords([]);
        setView('dashboard');
        setBootState('auth');
        triggerToast("You have been logged out.");
    }

    async function handleUpdateUser(patch) {
        try {
            const data = await apiJson('/api/users/me', 'PATCH', patch);
            setUser(data.user);
        } catch (err) {
            triggerToast(err.message || 'Could not update account.');
            throw err;
        }
    }

    async function handleChangePassword(currentPassword, newPassword) {
        await apiJson('/api/users/me/password', 'POST', { currentPassword, newPassword });
    }

    async function addRecord(record) {
        try {
            const data = await apiJson('/api/records', 'POST', record);
            setRecords(prev => [data.record, ...prev]);
            return data.record;
        } catch (err) {
            triggerToast(err.message || 'Could not save record.');
            throw err;
        }
    }

    async function updateRecord(record, password) {
        const data = await apiJson(`/api/records/${record.id}`, 'PATCH', { ...record, password });
        setRecords(prev => prev.map(r => r.id === data.record.id ? data.record : r));
        return data.record;
    }

    async function deleteRecord(id, password) {
        await apiJson(`/api/records/${id}`, 'DELETE', { password });
        setRecords(prev => prev.filter(r => r.id !== id));
    }

    async function verifyPassword(password) {
        await apiJson('/api/auth/verify', 'POST', { password });
        return true;
    }

    // Open a record's report. The list payload omits the heavy fundus image to
    // keep loads fast, so we show the record immediately (SVG fallback) and then
    // lazy-fetch the full record (with image) and swap it in.
    async function openRecord(record) {
        if (!record) return;
        setModalRecord(record);
        if (record.fundus_image) return;
        try {
            const full = await apiRequest(`/api/records/${record.id}`);
            if (full && full.record) {
                setModalRecord(prev => (prev && prev.id === full.record.id) ? full.record : prev);
            }
        } catch (_) { /* keep the partial record; report falls back to synthetic view */ }
    }

    if (bootState === 'loading') return <BootSplash message={bootMessage} />;
    if (bootState === 'auth' || !user) return <AuthPage onAuth={handleAuth} />;

    // For more interactive experience, pass in handlers for all key actions
    return (
        <div className="app-shell flex min-h-screen">
            <Sidebar currentView={view} setView={setView} user={user} onLogout={onLogout} />
            {/* Main content */}
            <main className="flex-1 ml-72 p-12 lg:p-16">
                <header className="flex justify-between items-center mb-12">
                    <GlobalSearch records={records} onPickRecord={openRecord} setView={setView} />
                    <div className="flex items-center gap-6">
                        <NotificationBell
                            notifications={notifications}
                            clearAll={() => { setNotifications([]); triggerToast("Notifications cleared!") }}
                        />
                        <div className="h-6 w-[1px] bg-slate-200"></div>
                        <div className="text-right hidden sm:block">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">Instance</p>
                            <p className="text-xs font-bold text-[#1a1a1e]">Calisto VisionCare</p>
                        </div>
                    </div>
                </header>
                {/* Main views — every page is rendered once and toggled with display:none
                    so that state (uploaded fundus image, screening results, search filters,
                    settings tabs, etc.) is preserved when the user navigates between pages. */}
                <div style={{ display: view === 'dashboard' ? 'block' : 'none' }}>
                  <Dashboard
                    onExport={() => triggerToast("Report exported to PDF (demo).")}
                    onNewDiagnostic={() => {
                        setView('screening');
                        triggerToast('Navigate to diagnostics.');
                    }}
                    statsChartDemo={() => triggerToast("Bar chart reacts to interaction (demo).")}
                    recordsDemo={records}
                    onRecordClick={openRecord}
                  />
                </div>
                <div style={{ display: view === 'screening' ? 'block' : 'none' }}>
                  <Diagnostics
                    isActive={view === 'screening'}
                    onResultSubmit={setLastScanResult}
                    onAddRecord={addRecord}
                    currentDoctor={user?.name || ''}
                    showToast={triggerToast}
                  />
                </div>
                <div style={{ display: view === 'records' ? 'block' : 'none' }}>
                  <PatientRegistry
                    records={records}
                    onRecordClick={openRecord}
                    onUpdateRecord={updateRecord}
                    onDeleteRecord={deleteRecord}
                    onVerifyPassword={verifyPassword}
                    showToast={triggerToast}
                  />
                </div>
                <div style={{ display: view === 'analytics' ? 'block' : 'none' }}>
                  <Analytics records={records} showToast={triggerToast} />
                </div>
                <div style={{ display: view === 'settings' ? 'block' : 'none' }}>
                  <Settings
                    showToast={triggerToast}
                    user={user}
                    onUpdateUser={handleUpdateUser}
                    onChangePassword={handleChangePassword}
                  />
                </div>
                <ToastComponent />
                {modalRecord && <RecordModal record={modalRecord} onClose={()=>setModalRecord(null)} />}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
